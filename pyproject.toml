[project]
name = "uv-jupyter-template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David Gray", email = "davidgraymi@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
uv-jupyter-template = "uv_jupyter_template:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]
